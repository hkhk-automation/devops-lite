<title>DevOps Lite projekt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: koodiredaktor — vasakul projekti puu kohtumiste kaupa, keskel fail, paremal selgitus, all terminal */
:root{
  --bg:#f3f4f8; --panel:#ffffff; --panel2:#eceef5; --fg:#1a1d33; --muted:#5d6280; --line:#d9dce8;
  --accent:#0c7a78; --accent-soft:#d6efed; --indigo:#3346a8; --indigo-soft:#e3e7fb;
  --warn:#a75400; --warn-soft:#fbecd8; --code-bg:#fbfbfd; --term-bg:#151833; --term-fg:#d8dbef;
  --kw:#3346a8; --str:#0c7a78; --cmt:#8a8fa8; --jinja:#a75400;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1124; --panel:#161936; --panel2:#1d2144; --fg:#e7e8f4; --muted:#9a9fbe; --line:#2a2f58;
  --accent:#4cc3be; --accent-soft:#143c43; --indigo:#9aa8ff; --indigo-soft:#252b5c;
  --warn:#f2a453; --warn-soft:#3a2b19; --code-bg:#13162f; --term-bg:#0a0c1c; --term-fg:#d8dbef;
  --kw:#9aa8ff; --str:#4cc3be; --cmt:#6d7296; --jinja:#f2a453; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1124; --panel:#161936; --panel2:#1d2144; --fg:#e7e8f4; --muted:#9a9fbe; --line:#2a2f58;
  --accent:#4cc3be; --accent-soft:#143c43; --indigo:#9aa8ff; --indigo-soft:#252b5c;
  --warn:#f2a453; --warn-soft:#3a2b19; --code-bg:#13162f; --term-bg:#0a0c1c; --term-fg:#d8dbef;
  --kw:#9aa8ff; --str:#4cc3be; --cmt:#6d7296; --jinja:#f2a453; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);padding-inline:16px;padding-block:16px}
.app{max-width:1440px;margin:0 auto;display:grid;gap:12px;grid-template-columns:290px minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr) 230px;height:calc(100% - 0px);min-height:640px}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.bar .who{font:600 13px var(--mono);color:var(--accent)}
.crumb{font:13px var(--mono);color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.crumb b{color:var(--fg);font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--muted);font-size:13px;cursor:pointer}
.search kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--panel)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);font:13px var(--sans);padding:5px 10px;cursor:pointer}
aside.tree,.editor,.info,.term{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;min-height:0}
aside.tree{overflow:auto;padding:10px 6px;grid-row:2/4}
.tree h2{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 10px 8px}
.k{margin-bottom:6px}
.k>button{all:unset;display:flex;align-items:center;gap:8px;width:calc(100% - 8px);padding:6px 10px;border-radius:6px;cursor:pointer;font:600 14px var(--sans)}
.k>button:hover{background:var(--panel2)}
.k>button .tag{margin-left:auto;font:500 10px var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:99px}
.tag.on{background:var(--accent-soft);color:var(--accent)}.tag.soon{background:var(--panel2);color:var(--muted)}
.k>button .car{width:10px;color:var(--muted);transition:transform .15s}
.k.open>button .car{transform:rotate(90deg)}
.k ul{list-style:none;margin:2px 0 6px;padding:0;display:none}
.k.open ul{display:block}
.k li button{all:unset;display:block;width:calc(100% - 8px);padding:4px 10px 4px 28px;border-radius:6px;font:13px var(--mono);color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k li button:hover{background:var(--panel2);color:var(--fg)}
.k li button[aria-current="true"]{background:var(--indigo-soft);color:var(--indigo);font-weight:600}
.k li .dir{color:var(--muted);opacity:.7}
button:focus-visible,.search:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.editor{display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font:13px var(--mono)}
.tabs .fname{color:var(--fg);font-weight:600}
.tabs .lang{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.tabs .preview{margin-left:auto;font:500 11px var(--sans);color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:99px}
pre.code{margin:0;flex:1;overflow:auto;background:var(--code-bg);padding:12px 0;font:13.5px/1.65 var(--mono);counter-reset:ln}
.ln{display:flex;padding-right:16px;white-space:pre}
.ln::before{counter-increment:ln;content:counter(ln);width:48px;flex:none;text-align:right;padding-right:16px;color:var(--cmt);user-select:none}
.ln.note{background:var(--indigo-soft);cursor:pointer}
.ln.note::after{content:"?";margin-left:auto;padding-left:16px;font:700 11px var(--sans);color:var(--indigo)}
.ln.sel{background:var(--accent-soft);box-shadow:inset 3px 0 var(--accent)}
.c-cmt{color:var(--cmt);font-style:italic}.c-key{color:var(--kw)}.c-str{color:var(--str)}.c-jinja{color:var(--jinja);font-weight:600}.c-sec{color:var(--kw);font-weight:600}
.info{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.info h3{margin:0;font:700 18px/1.25 var(--sans);text-wrap:balance}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 12px var(--sans);padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.chip.k1{background:var(--accent-soft);color:var(--accent)}
.info p{margin:0;max-width:62ch}
.box{border-radius:8px;padding:10px 12px;font-size:14px}
.box b{display:block;font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.box.note{background:var(--indigo-soft)}.box.note b{color:var(--indigo)}
.box.err{background:var(--warn-soft)}.box.err b{color:var(--warn)}
.info a{color:var(--indigo)}
.cmds{display:flex;flex-direction:column;gap:6px}
.cmds button{all:unset;cursor:pointer;font:12.5px var(--mono);background:var(--term-bg);color:var(--term-fg);padding:6px 10px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmds button::before{content:"$ ";color:var(--accent)}
.cmds button:hover{outline:1px solid var(--accent)}
code{font:12.5px var(--mono);background:var(--panel2);padding:1px 5px;border-radius:4px}
.term{grid-column:2/4;background:var(--term-bg);border-color:var(--term-bg);display:flex;flex-direction:column;overflow:hidden}
.term .out{flex:1;overflow:auto;padding:10px 14px;font:12.5px/1.55 var(--mono);color:var(--term-fg);white-space:pre-wrap;word-break:break-word}
.term .p{color:#4cc3be}.term .dim{color:#7d82a6}.term .ok{color:#7bd88f}.term .bad{color:#ff8a80}.term .y{color:#f2a453}
.term form{display:flex;align-items:center;gap:8px;border-top:1px solid #23284d;padding:8px 14px}
.term label{font:12.5px var(--mono);color:#4cc3be;white-space:nowrap}
.term input{flex:1;min-width:0;background:transparent;border:0;color:var(--term-fg);font:12.5px var(--mono);outline:none}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);padding:0;width:min(560px,92vw)}
dialog::backdrop{background:rgba(10,12,30,.45)}
dialog input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);font:15px var(--sans);padding:14px 16px;outline:none}
dialog ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
dialog li button{all:unset;display:flex;gap:10px;width:calc(100% - 20px);padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px}
dialog li button:hover,dialog li button.hl{background:var(--panel2)}
dialog li small{margin-left:auto;color:var(--muted);font:12px var(--mono)}
@media (max-width:1100px){.app{grid-template-columns:230px minmax(0,1fr);grid-template-rows:auto minmax(420px,1fr) auto 230px;height:auto}
  .info{grid-column:2}.term{grid-column:1/-1}aside.tree{grid-row:2/4}}
@media (max-width:700px){body{padding-inline:12px}.app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  aside.tree,.term,.info{grid-column:1;grid-row:auto}aside.tree{max-height:260px}.editor{min-height:380px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<script type="text/plain" id="f-README.md"># DevOps Lite: üks projekt, viis kohtumist

See on kursuse projekt nii, nagu see kasvab.
Iga kaust on üks kohtumine. Iga järgmine ehitab eelmisele peale.

  k1/  üks playbook, kolm ühesugust serverit
  k2/  rollid ja kolmekihiline rakendus
  k3/  sama rakendus konteinerites
  k4/  GitHub Actions kontrollib ja tarnib
  k5/  OpenTofu loob masinad, Kubernetes jooksutab rakendust

Kuidas lugeda:
  - vasakul vali fail
  - sinise taustaga ridadel on selgitus, klõpsa neil
  - paremal: mis see fail on, levinud viga, link juhendisse
  - all terminal: klõpsa käsul või kirjuta ise (help)
</script>

vm1

<script type="text/plain" id="f-k1/bootstrap.yml">- name: Bootstrap veebiserver
  hosts: kohalik:veeb
  become: true
  vars:
    lehe_pealkiri: "Hallatud Ansible'iga"
  tasks:
    - name: Kasutaja saidi on olemas
      ansible.builtin.user:
        name: saidi

    - name: nginx on paigaldatud
      ansible.builtin.package:
        name: nginx
        state: present

    - name: Avaleht on paigas
      ansible.builtin.copy:
        dest: /usr/share/nginx/html/index.html
        content: "<h1>{{ lehe_pealkiri }}</h1><p>{{ inventory_hostname }}</p>\n"

    - name: nginx käib
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: HTTP on tulemüüris lubatud
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled
</script>

<script type="text/plain" id="f-k2/site.yml">- name: Ühine baas kõigile masinatele
  hosts: stack
  become: true
  roles:
    - common

- name: Andmebaas
  hosts: db
  become: true

    - db

- name: Rakendusserverid
  hosts: app

  hosts: lb

  roles:
    - lb

<script type="text/plain" id="f-k2/roles/db/tasks/kasutaja.yml">- name: Kontrolli, kas andmebaasi kasutaja on olemas
  ansible.builtin.command: psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ db_kasutaja }}'"
  become_user: postgres
  register: db_roll
  changed_when: false
  check_mode: false

- name: Andmebaasi kasutaja on olemas
  ansible.builtin.command: psql -c "CREATE ROLE {{ db_kasutaja }} LOGIN PASSWORD '{{ db_parool }}'"
  become_user: postgres
  when: db_roll.stdout != "1"
  no_log: true
</script>

<script type="text/plain" id="f-k2/roles/app/templates/labori-app.env.j2"># {{ ansible_managed }}
APP_NIMI="{{ app_nimi }}"
APP_PORT={{ app_port }}
DB_HOST={{ hostvars[groups['db'][0]].ansible_default_ipv4.address }}
DB_NIMI={{ db_nimi }}
DB_KASUTAJA={{ db_kasutaja }}
DB_PAROOL={{ db_parool }}
</script>

<script type="text/plain" id="f-k2/roles/lb/templates/nginx.conf.j2">upstream rakendus {
{% for h in groups['app'] %}
    server {{ hostvars[h].ansible_default_ipv4.address }}:{{ hostvars[h].app_port }} max_fails=1 fail_timeout=10s;
{% endfor %}
}

server {
    listen 80 default_server;
    location / {
        proxy_pass http://rakendus;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
</script>

<script type="text/plain" id="f-k2/roles/lb/tasks/main.yml">- name: nginx tohib ühenduda rakendusserveritega (SELinux)
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true

- name: Koormusjaoturi seadistus on paigas
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    validate: nginx -t -c %s
  notify: nginx laeb seaded uuesti
</script>

<script type="text/plain" id="f-k3/Containerfile">FROM registry.access.redhat.com/ubi9/python-311
WORKDIR /app
COPY app.py .
RUN pip install --no-cache-dir psycopg2-binary
USER 1001
EXPOSE 8080
CMD ["python3", "app.py"]
</script>

<script type="text/plain" id="f-k3/compose.yaml">services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: labor
      POSTGRES_USER: labor
      POSTGRES_PASSWORD: ${DB_PAROOL}
    volumes:
      - andmed:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "labor"]
      interval: 5s

  app:
    build: .
    environment:
      DB_HOST: db
      DB_PAROOL: ${DB_PAROOL}
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: docker.io/library/nginx:1.27
    ports:
      - "80:80"
    depends_on: [app]

volumes:
  andmed:
</script>

<script type="text/plain" id="f-k4/.github/workflows/ci.yml">name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ansible-lint yamllint
      - run: yamllint . && ansible-lint

  image:
    needs: lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: k3
          push: true
          tags: ghcr.io/${{ github.repository }}/labori-app:${{ github.sha }}
</script>

<script type="text/plain" id="f-k5/main.tf">terraform {
  required_providers {
    proxmox = {
      source  = "bpg/proxmox"
      version = "~> 0.70"
    }
  }
}

resource "proxmox_virtual_environment_vm" "rakendus" {
  count     = var.masinaid
  name      = "app-${count.index + 1}"
  node_name = var.node
  tags      = ["lab.automatiseerimine"]

  clone {
    vm_id = 9000
  }
  cpu {
    cores = 2
  }
  memory {
    dedicated = 2048
  }
}

output "ip" {
  value = proxmox_virtual_environment_vm.rakendus[*].ipv4_addresses
}
</script>

<script type="text/plain" id="f-k5/k8s/deployment.yaml">apiVersion: apps/v1
kind: Deployment
metadata:
  name: labori-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: labori-app
  template:
    metadata:
      labels:
        app: labori-app
    spec:
      containers:
        - name: app
          image: ghcr.io/sinu-repo/labori-app:1.0
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: labori-db
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
</script>

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const inl = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const $ = id => document.getElementById(id);
const FILES = [...document.querySelectorAll('script[id^="f-"]')].map(s => s.id.slice(2));
const src = f => $('f-' + f).textContent.replace(/^\n/, '').replace(/\n$/, '');

function hl(line, lang) {
  // kommentaar rea lõpus (mitte stringi või malli sees)
  let body = line, cmt = '';
  const cm = lang === 'hcl' ? /(^|\s)(#|\/\/).*$/ : (lang === 'jinja' ? /^\s*#(?!\{).*$/ : /(^|\s)#(?!\{).*$/);
  const m = body.match(cm);
  if (m && !/["'][^"']*$/.test(body.slice(0, m.index))) { cmt = body.slice(m.index); body = body.slice(0, m.index); }
  // üks läbikäik: mallid ja stringid, ülejäänu escape'itud
  const re = /(\$\{\{.*?\}\}|\{\{.*?\}\}|\{%.*?%\}|\$\{[^}]*\})|("[^"]*"|'[^']*')/g;
  let out = '', last = 0, t;
  const plain = x => {
    let h = esc(x);
    if (lang === 'ini') h = h.replace(/^(\[[^\]]+\])/, '<span class="c-sec">$1</span>').replace(/^([\w.]+)(\s*=)/, '<span class="c-key">$1</span>$2');
    if (lang === 'yaml' && last === 0) h = h.replace(/^(\s*-?\s*)([\w.\-\/]+)(:)(?=\s|$)/, '$1<span class="c-key">$2</span>$3');
    if (lang === 'docker') h = h.replace(/^(FROM|WORKDIR|COPY|RUN|USER|EXPOSE|CMD|ENV)\b/, '<span class="c-sec">$1</span>');
    if (lang === 'hcl' && last === 0) h = h.replace(/^(\s*)(resource|output|terraform|required_providers|clone|cpu|memory)\b/, '$1<span class="c-sec">$2</span>').replace(/^(\s*)(\w+)(\s*=)/, '$1<span class="c-key">$2</span>$3');
    return h;
  };
  while ((t = re.exec(body))) {
    out += plain(body.slice(last, t.index));
    out += `<span class="${t[1] ? 'c-jinja' : 'c-str'}">${esc(t[0])}</span>`;
    last = re.lastIndex;
  }
  out += plain(body.slice(last));
  return out + (cmt ? `<span class="c-cmt">${esc(cmt)}</span>` : '');
}

let cur = null, sel = null;
function show(f, line) {
  cur = f; sel = line || null;
  const m = META[f] || {}, lines = src(f).split('\n');
  $('crumb').innerHTML = '~/projekt/' + f.split('/').map((p, i, a) => i === a.length - 1 ? '<b>' + esc(p) + '</b>' : esc(p)).join('/');
  $('fname').textContent = f.split('/').pop();
  $('flang').textContent = m.lang || '';
  $('fprev').hidden = !m.preview;
  $('code').innerHTML = lines.map((l, i) => {
    const n = i + 1, note = m.notes && m.notes[n];
    return `<span class="ln${note ? ' note' : ''}${sel === n ? ' sel' : ''}" data-n="${n}">${hl(l, m.lang) || ' '}</span>`;
  }).join('');
  document.querySelectorAll('#code .ln.note').forEach(el => el.onclick = () => show(f, +el.dataset.n));
  const note = sel && m.notes ? m.notes[sel] : null;
  $('info').innerHTML =
    `<div class="meta"><span class="chip ${m.preview ? '' : 'k1'}">${esc(m.k || '')}</span>${m.preview ? '<span class="chip">eelvaade</span>' : ''}</div>` +
    `<h3>${esc(m.title || f)}</h3><p>${inl(m.about || '')}</p>` +
    (note ? `<div class="box note"><b>Rida ${sel}</b>${inl(note)}</div>` : (m.notes ? '<p style="color:var(--muted);font-size:13px">Klõpsa sinisel real, et näha selle selgitust.</p>' : '')) +
    (m.err ? `<div class="box err"><b>Levinud viga</b>${inl(m.err)}</div>` : '') +
    (m.guide ? `<p>Juhendis: <a href="${m.guide[1]}" target="_blank" rel="noopener">${esc(m.guide[0])}</a></p>` : '') +
    (m.cmds ? `<div class="cmds">${m.cmds.map(c => `<button type="button" data-c="${esc(c).replace(/"/g, '&quot;')}">${esc(c)}</button>`).join('')}</div>` : '');
  document.querySelectorAll('.cmds button').forEach(b => b.onclick = () => run(b.dataset.c));
  document.querySelectorAll('.k li button').forEach(b => b.setAttribute('aria-current', b.dataset.f === f));
  const k = f.split('/')[0]; const box = document.querySelector(`.k[data-k="${k}"]`); if (box) box.classList.add('open');
  if (sel) { const el = document.querySelector(`#code .ln[data-n="${sel}"]`); el && el.scrollIntoView({block:'nearest'}); }
  try { localStorage.setItem('fail', f); } catch (e) {}
}

function buildTree() {
  $('tree').innerHTML = MEETINGS.map(mt => {
    if (mt.single) return `<div class="k"><ul style="display:block"><li><button type="button" data-f="${mt.id}" style="padding-left:10px">${mt.label}</button></li></ul></div>`;
    const fs = FILES.filter(f => f.startsWith(mt.id + '/'));
    return `<div class="k" data-k="${mt.id}"><button type="button"><span class="car">▸</span>${esc(mt.label)}<span class="tag ${mt.ready ? 'on' : 'soon'}">${mt.ready ? 'valmis' : 'tulemas'}</span></button><ul>` +
      fs.map(f => { const p = f.slice(mt.id.length + 1).split('/'); const name = p.pop();
        return `<li><button type="button" data-f="${f}" title="${f}">${p.length ? `<span class="dir">${esc(p.join('/'))}/</span>` : ''}${esc(name)}</button></li>`; }).join('') + '</ul></div>';
  }).join('');
  document.querySelectorAll('.k>button').forEach(b => b.onclick = () => b.parentElement.classList.toggle('open'));
  document.querySelectorAll('.k li button').forEach(b => b.onclick = () => show(b.dataset.f));
}

const out = $('out');
function print(html) { out.innerHTML += html + '\n'; out.scrollTop = out.scrollHeight; }
function run(c) {
  c = c.trim(); if (!c) return;
  print(`<span class="p">kasutaja@vm1:~/projekt$</span> ${esc(c)}`);
  if (c === 'clear') { out.innerHTML = ''; return; }
  if (/^sudo rm -rf/.test(c)) return print('<span class="y">Tahvel nägi seda. vm1 ütleb: ei.</span>');
  if (/^cat\s+/.test(c)) { const f = c.slice(4).trim(); if (FILES.includes(f)) { show(f); return print(esc(src(f))); } }
  if (/^cd\s+/.test(c)) { const d = c.slice(3).trim().replace(/\/$/, ''); const f = FILES.find(x => x.startsWith(d + '/')); if (f) { show(f); return print(`<span class="dim">avasin ${esc(f)}</span>`); } }
  print(OUT[c] || `<span class="dim">Seda käsku see näidisterminal ei tunne. Proovi </span>help<span class="dim"> või klõpsa käsul paremal.</span>`);
}
$('tform').onsubmit = e => { e.preventDefault(); run($('tin').value); $('tin').value = ''; };

/* Otsing */
const dlg = $('dlg'), q = $('q'), res = $('res'); let hits = [], hi = 0;
function search() {
  const t = q.value.toLowerCase();
  hits = FILES.filter(f => !t || f.toLowerCase().includes(t) || (META[f] && (META[f].title + ' ' + META[f].about).toLowerCase().includes(t))).slice(0, 12);
  hi = 0; res.innerHTML = hits.map((f, i) => `<li><button type="button" class="${i === hi ? 'hl' : ''}" data-f="${f}">${esc((META[f] || {}).title || f)}<small>${esc(f)}</small></button></li>`).join('') || '<li style="padding:10px;color:var(--muted)">Ei leidnud. Proovi: mall, handler, compose, tofu</li>';
  res.querySelectorAll('button').forEach(b => b.onclick = () => { dlg.close(); show(b.dataset.f); });
}
function openSearch() { q.value = ''; search(); dlg.showModal(); q.focus(); }
$('openSearch').onclick = openSearch;
q.oninput = search;
q.onkeydown = e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); hi = (hi + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % Math.max(hits.length, 1); res.querySelectorAll('button').forEach((b, i) => b.classList.toggle('hl', i === hi)); }
  if (e.key === 'Enter' && hits[hi]) { dlg.close(); show(hits[hi]); }
};
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); } });

$('theme').onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
};

buildTree();
let start = 'k2/roles/lb/templates/nginx.conf.j2';
try { const s = localStorage.getItem('fail'); if (s && FILES.includes(s)) start = s; } catch (e) {}
show(start, start === 'k2/roles/lb/templates/nginx.conf.j2' ? 3 : null);
print('<span class="dim">Näidisterminal. Kirjuta </span>help<span class="dim"> või klõpsa käsul paremal.</span>');
run('ansible-inventory --graph');
</script>
</body></html>
